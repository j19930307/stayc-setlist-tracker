<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0e17">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="STAYC Setlist">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>STAYC Concert Setlist Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      // 只在支援 hover 的裝置套用 hover 樣式，避免手機點完按鈕後樣式「卡住」
      future: { hoverOnlyWhenSupported: true },
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', '-apple-system', '"PingFang TC"', '"Microsoft JhengHei"', 'sans-serif'],
          },
          colors: {
            stayc: {
              pink: '#ff4b82',
              purple: '#8b5cf6',
              neon: '#ff7eb6',
              dark: '#0f0e17',
              card: '#1a1829',
              border: '#2e294e',
            }
          }
        }
      }
    }
  </script>
  <style>
    html { -webkit-text-size-adjust: 100%; }
    body {
      background-color: #0b0a12;
      color: #fffffe;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
      /* 取消雙擊縮放，連點歌曲時才不會誤放大 */
      touch-action: manipulation;
    }
    button, summary, label {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    :focus-visible { outline: 2px solid #ff7eb6; outline-offset: 2px; }
    .glow-text { text-shadow: 0 0 15px rgba(255, 75, 130, 0.45); }
    .btn-press:active { transform: scale(0.96); }

    /* 防止 iOS Safari 點擊輸入框時畫面強制放大 (Auto-zoom) */
    @media (max-width: 768px) {
      input, select, textarea { font-size: 16px !important; }
    }

    /* details 摺疊區 */
    summary { list-style: none; }
    summary::-webkit-details-marker { display: none; }
    details[open] > summary .chev { transform: rotate(180deg); }
    .chev { transition: transform .2s; }

    /* 橫向捲動列隱藏捲軸 */
    .no-scrollbar { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* 已加入歌單的歌曲：降低亮度並標示勾勾，一眼看出還沒唱的 */
    .song-chip.is-added { opacity: .6; border-color: rgba(255, 126, 182, .6) !important; }

    @keyframes flash { from { background-color: rgba(255, 75, 130, .3); } }
    .flash { animation: flash .9s ease-out; }
    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(1); } }
    .bump { animation: bump .35s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      .flash, .bump { animation: none; }
      .btn-press:active { transform: none; }
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0f0e17; }
    ::-webkit-scrollbar-thumb { background: #2e294e; border-radius: 9999px; }
  </style>
</head>
<body class="flex flex-col font-sans selection:bg-pink-500 selection:text-white">

  <!-- Header -->
  <header id="app-header" class="sticky top-0 z-40 bg-[#0f0e17]/95 backdrop-blur-md border-b border-stayc-border px-4 pb-2"
          style="padding-top: calc(env(safe-area-inset-top, 0px) + 0.5rem)">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <span class="inline-flex shrink-0 items-center justify-center w-9 h-9 rounded-lg bg-gradient-to-tr from-stayc-pink to-stayc-purple text-white font-black text-sm shadow-lg shadow-pink-500/20">ST</span>
        <div class="min-w-0">
          <h1 class="text-base font-bold tracking-tight glow-text flex items-center gap-1.5 text-white">
            STAYC <span class="text-stayc-neon text-xs font-semibold px-1.5 py-0.5 rounded bg-pink-950/60 border border-pink-500/30">Setlist</span>
          </h1>
          <p class="text-[11px] text-gray-400 truncate">演唱會歌單即時筆記</p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <button id="wake-btn" type="button" aria-pressed="false" aria-label="螢幕常亮" title="螢幕常亮"
                class="btn-press w-11 h-11 flex items-center justify-center rounded-xl bg-gray-800/80 text-gray-400 border border-gray-700/60 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
        <button id="copy-btn" type="button" class="btn-press h-11 px-4 text-sm font-semibold rounded-xl bg-stayc-pink text-white flex items-center gap-1.5 shadow-md shadow-pink-600/30">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
          複製
        </button>
      </div>
    </div>
  </header>

  <!-- ========== 檢視 1：選曲 ========== -->
  <main id="view-pick" class="flex-1 max-w-4xl w-full mx-auto px-4 pt-4 space-y-4"
        style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6rem)">

    <!-- 演唱會環節 -->
    <section>
      <h2 class="text-xs font-bold tracking-wider text-stayc-neon mb-2">演唱會環節</h2>
      <div class="flex flex-wrap gap-2">
        <button type="button" class="tag-btn btn-press min-h-[44px] text-sm font-medium px-4 rounded-xl bg-purple-950/50 border border-purple-500/30 text-purple-200" data-type="event" data-title="🎬 VCR">🎬 VCR</button>
        <button type="button" class="tag-btn btn-press min-h-[44px] text-sm font-medium px-4 rounded-xl bg-sky-950/50 border border-sky-500/30 text-sky-200" data-type="event" data-title="💬 Ment (打招呼 / 講話)">💬 Ment</button>
        <button type="button" class="tag-btn btn-press min-h-[44px] text-sm font-medium px-4 rounded-xl bg-pink-950/50 border border-pink-500/30 text-pink-200" data-type="event" data-title="✨ Encore (安可)">✨ Encore</button>
        <button type="button" class="tag-btn btn-press min-h-[44px] text-sm font-medium px-4 rounded-xl bg-fuchsia-950/50 border border-fuchsia-500/30 text-fuchsia-200" data-type="event" data-title="🎀 Double Encore (二次安可)">🎀 二次安可</button>
        <button type="button" class="tag-btn btn-press min-h-[44px] text-sm font-medium px-4 rounded-xl bg-amber-950/50 border border-amber-500/30 text-amber-200" data-type="event" data-title="📸 拍照時間 (Photo Time)">📸 拍照時間</button>
      </div>
    </section>

    <!-- 手動新增 (預設收合) -->
    <details id="custom-details" class="rounded-2xl bg-stayc-card/90 border border-stayc-border">
      <summary class="flex items-center justify-between min-h-[52px] px-4 cursor-pointer text-sm font-semibold text-white">
        <span>✏️ 手動新增曲目 / 備註</span>
        <svg class="chev w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </summary>
      <form id="custom-form" class="px-4 pb-4 space-y-2">
        <input type="text" id="custom-name" required enterkeyhint="next" autocomplete="off"
               class="w-full h-12 bg-[#12111d] border border-gray-700/60 rounded-xl px-3 text-white placeholder-gray-500 focus:outline-none focus:border-stayc-pink"
               placeholder="歌名（如：特別翻唱）">
        <input type="text" id="custom-note" enterkeyhint="done" autocomplete="off"
               class="w-full h-12 bg-[#12111d] border border-gray-700/60 rounded-xl px-3 text-gray-300 placeholder-gray-500 focus:outline-none focus:border-stayc-pink"
               placeholder="備註（選填）">
        <button type="submit" class="btn-press w-full h-12 bg-gradient-to-r from-stayc-pink to-stayc-purple text-white rounded-xl text-sm font-bold shadow-md shadow-pink-600/20">
          加入歌單
        </button>
      </form>
    </details>

    <!-- 曲庫搜尋 -->
    <section>
      <div class="relative">
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z"/></svg>
        <input type="search" id="song-filter" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
               class="w-full h-12 pl-10 pr-11 bg-[#12111d] border border-gray-700/60 rounded-xl text-gray-200 placeholder-gray-500 focus:outline-none focus:border-stayc-pink"
               placeholder="搜尋曲名（跨所有專輯）">
        <button id="filter-clear" type="button" aria-label="清除搜尋" class="hidden absolute right-1 top-1/2 -translate-y-1/2 w-10 h-10 items-center justify-center text-gray-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </section>

    <!-- 專輯標籤 (捲動時固定在 Header 下方) -->
    <div id="album-tabs-wrap" class="sticky z-30 -mx-4 px-4 py-2 bg-[#0b0a12]/95 backdrop-blur-md" style="top: var(--hdr-h, 64px)">
      <div id="album-tabs" class="flex gap-2 overflow-x-auto no-scrollbar"></div>
    </div>

    <!-- 歌曲清單 (依專輯分組) -->
    <div id="songs-grid" class="space-y-3"></div>
  </main>

  <!-- ========== 檢視 2：歌單 ========== -->
  <main id="view-list" class="hidden flex-1 max-w-4xl w-full mx-auto px-4 pt-4 space-y-4"
        style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6rem)">

    <div class="flex items-center justify-between">
      <h2 class="text-base font-bold text-white flex items-center gap-2">
        當前歌單
        <span id="setlist-count" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-stayc-pink/20 text-stayc-neon border border-stayc-pink/30">0 首</span>
      </h2>
      <button id="clear-btn" type="button" class="btn-press h-10 px-4 text-xs font-medium rounded-xl bg-gray-800/80 text-gray-300 border border-gray-700/60">
        清空
      </button>
    </div>

    <!-- 演出資訊 (預設收合) -->
    <details id="info-details" class="rounded-2xl bg-stayc-card/90 border border-stayc-border">
      <summary class="flex items-center justify-between min-h-[52px] px-4 cursor-pointer">
        <span class="min-w-0">
          <span class="block text-[11px] text-gray-400">演出資訊（點開編輯）</span>
          <span id="info-summary" class="block text-sm font-semibold text-white truncate"></span>
        </span>
        <svg class="chev w-4 h-4 text-gray-400 shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </summary>
      <div class="px-4 pb-4 space-y-3">
        <div>
          <label for="concert-title" class="block text-xs font-medium text-gray-400 mb-1">演出名稱</label>
          <input type="text" id="concert-title" enterkeyhint="next" class="w-full h-12 bg-[#12111d] border border-gray-700/60 rounded-xl px-3 font-semibold text-white focus:outline-none focus:border-stayc-neon" placeholder="STAYC Concert Tour">
        </div>
        <div>
          <label for="concert-meta" class="block text-xs font-medium text-gray-400 mb-1">日期與地點</label>
          <input type="text" id="concert-meta" enterkeyhint="done" class="w-full h-12 bg-[#12111d] border border-gray-700/60 rounded-xl px-3 text-gray-300 focus:outline-none focus:border-stayc-neon" placeholder="2026.10.11 @ Arena">
        </div>
      </div>
    </details>

    <!-- 空狀態 -->
    <div id="empty-state" class="text-center py-12 text-gray-500 text-sm">
      <div class="text-3xl mb-2">🎶</div>
      <p class="mb-4">歌單還是空的，先去選第一首歌吧！</p>
      <button id="goto-pick" type="button" class="btn-press h-12 px-6 rounded-xl bg-gradient-to-r from-stayc-pink to-stayc-purple text-white text-sm font-bold">去選曲</button>
    </div>

    <ul id="setlist-items" class="space-y-2"></ul>
  </main>

  <!-- 底部導覽列 (拇指好按) -->
  <nav id="bottom-nav" class="fixed bottom-0 inset-x-0 z-40 bg-[#0f0e17]/95 backdrop-blur-md border-t border-stayc-border"
       style="padding-bottom: env(safe-area-inset-bottom, 0px)">
    <div class="max-w-4xl mx-auto grid grid-cols-2 gap-2 p-2">
      <button type="button" data-view="pick" class="nav-btn btn-press h-12 rounded-xl text-sm font-bold flex items-center justify-center gap-2">🎵 選曲</button>
      <button type="button" data-view="list" class="nav-btn btn-press h-12 rounded-xl text-sm font-bold flex items-center justify-center gap-2">
        📋 歌單
        <span id="nav-count" class="min-w-[1.5rem] h-6 px-1.5 rounded-full bg-white/20 text-xs font-bold flex items-center justify-center">0</span>
      </button>
    </div>
  </nav>

  <!-- Toast (可附「復原」按鈕) -->
  <div id="toast" role="status" aria-live="polite"
       class="fixed left-1/2 -translate-x-1/2 max-w-[calc(100%-2rem)] bg-gradient-to-r from-stayc-pink to-stayc-purple text-white text-sm font-semibold pl-4 pr-2 py-1.5 rounded-full shadow-xl shadow-pink-500/30 transition-all opacity-0 translate-y-3 duration-300 z-50 flex items-center gap-2"
       style="bottom: calc(env(safe-area-inset-bottom, 0px) + 5rem); pointer-events: none">
    <span id="toast-msg" class="min-w-0 truncate py-1.5">已成功複製歌單！</span>
    <button id="toast-undo" type="button" class="hidden shrink-0 h-9 px-3 rounded-full bg-white/25 text-xs font-bold">復原</button>
  </div>

  <!-- 無法自動複製時的備援視窗 -->
  <div id="copy-modal" class="hidden fixed inset-0 z-[60] items-end sm:items-center justify-center bg-black/70">
    <div class="w-full max-w-md bg-stayc-card rounded-t-3xl sm:rounded-3xl border border-stayc-border p-4"
         style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem)">
      <p class="text-sm font-bold text-white">請手動複製</p>
      <p class="text-xs text-gray-400 mt-1 mb-3">這個瀏覽器不允許自動複製。長按下方文字、全選後複製即可。</p>
      <textarea id="copy-textarea" readonly rows="10" class="w-full bg-[#12111d] border border-gray-700/60 rounded-xl p-3 text-gray-200 focus:outline-none"></textarea>
      <div class="flex gap-2 mt-3">
        <button id="share-btn" type="button" class="hidden btn-press flex-1 h-12 rounded-xl bg-stayc-pink text-white text-sm font-bold">分享</button>
        <button id="copy-close" type="button" class="btn-press flex-1 h-12 rounded-xl bg-gray-800 text-gray-200 text-sm font-bold">關閉</button>
      </div>
    </div>
  </div>

          { name: "SO BAD", isTitle: true },
          { name: "LIKE THIS", isTitle: false }
        ]
      },
      {
        id: "special_unit",
        short: "特別企劃 / 日單",
        name: "Special & JP Singles",
        year: "Special",
        songs: [
          { name: "Over U, 안녕 (Seeun x J)", isTitle: true, isUnit: true },
          { name: "Lover, Killer", isTitle: true },
          { name: "Poppy", isTitle: true },
          { name: "LIT", isTitle: true },
          { name: "MEOW", isTitle: true }
        ]
      },
      {
        id: "fanconcert_solo",
        short: "Fanconcert 舞台",
        name: "🎤 Fanconcert 首爾場特別舞台 / 組曲 / Solo",
        year: "Concert Special",
        songs: [
          { name: "RUN2U / Poppy (Korean Ver.) / Cheeky Icy Thang / GPT / BEBE / 색안경 (STEREOTYPE) / ASAP", isTitle: true, isMedley: true },
          { name: "ISA - Bo peep Bo peep (T-ARA)", isSolo: true },
          { name: "Sumin - Bubble Pop! (HyunA)", isSolo: true },
          { name: "Sumin - I Really Like You (Carly Rae Jepsen)", isSolo: true },
          { name: "Seeun - 민들레 (Dandelion) (우효 / OOHYO)", isSolo: true },
          { name: "Seeun - BIRDS OF A FEATHER (Billie Eilish)", isSolo: true },
          { name: "Yoon - 맹그로브 (Mangrove tree) (YOUNHA)", isSolo: true },
          { name: "J - Mantra (JENNIE)", isSolo: true },
          { name: "J - Levitating (Dua Lipa)", isSolo: true },
          { name: "Sieun - Greedy (Ariana Grande)", isSolo: true },
          { name: "Sieun - toxic till the end (ROSÉ)", isSolo: true }
        ]
      }
    ];

    // ---------- 狀態 ----------
    let setlist = [];
    let currentAlbumFilter = 'all';
    let currentView = 'pick';
    const scrollPos = { pick: 0, list: 0 };
    let listDirty = false;        // 自上次看歌單後是否有新增（切過去時自動捲到底）
    let lastSnapshot = null;      // 供「復原」使用的上一個狀態
    let lastTouchedId = null;     // 剛新增 / 移動的項目，用來閃一下提示
    let prevSongCount = 0;
    const STORAGE_KEY = 'stayc_setlist_data';
    const META_KEY = 'stayc_concert_meta';
    const WAKE_KEY = 'stayc_wake_lock';

    const $ = (id) => document.getElementById(id);

    // localStorage 在無痕模式或部分 In-app 瀏覽器可能丟例外，包起來避免整個頁面壞掉
    function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function safeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* ignore */ } }

    function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms || 12); }

    // 轉義 HTML 防止 XSS / 破版
    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ---------- 初始化 ----------
    window.addEventListener('DOMContentLoaded', () => {
      loadMeta();
      loadSetlist();
      renderAlbumTabs();
      renderSongsGrid();
      setupEventListeners();
      setupHeaderOffset();
      setupWakeLock();
      showView('pick', { initial: true });
      if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    });

    // 量測 Header 高度，讓專輯標籤列能剛好黏在它下方
    function setupHeaderOffset() {
      const hdr = $('app-header');
      const set = () => document.documentElement.style.setProperty('--hdr-h', hdr.offsetHeight + 'px');
      set();
      window.addEventListener('resize', set);
      if ('ResizeObserver' in window) new ResizeObserver(set).observe(hdr);
    }

    // ---------- 演唱會資訊 ----------
    function loadMeta() {
      let meta = {};
      try { meta = JSON.parse(safeGet(META_KEY) || '{}'); } catch (e) { meta = {}; }
      $('concert-title').value = meta.title || 'STAYC CONCERT TOUR';
      $('concert-meta').value = meta.meta || '2026.10.11 @ Live Stage';
      updateInfoSummary();
    }

    function saveMeta() {
      safeSet(META_KEY, JSON.stringify({
        title: $('concert-title').value,
        meta: $('concert-meta').value,
      }));
      updateInfoSummary();
    }

    function updateInfoSummary() {
      const t = $('concert-title').value.trim() || 'STAYC CONCERT';
      const m = $('concert-meta').value.trim();
      $('info-summary').textContent = m ? `${t}｜${m}` : t;
    }

    // ---------- 歌單資料 ----------
    function loadSetlist() {
      try {
        const stored = safeGet(STORAGE_KEY);
        if (stored) setlist = JSON.parse(stored);
      } catch (e) {
        console.error(e);
        setlist = [];
      }
      prevSongCount = setlist.filter(i => i.type === 'song').length;
      renderSetlist();
    }

    function persist() { safeSet(STORAGE_KEY, JSON.stringify(setlist)); }
    function commit() { persist(); renderSetlist(); }
    function takeSnapshot() { lastSnapshot = JSON.stringify(setlist); }

    function undo() {
      if (lastSnapshot === null) return;
      setlist = JSON.parse(lastSnapshot);
      lastSnapshot = null;
      lastTouchedId = null;
      commit();
      showToast('已復原');
    }

    // 新增項目 (無時間戳記)
    function addItem(item) {
      takeSnapshot();
      const id = Date.now() + Math.random().toString(36).slice(2, 6);
      setlist.push({ id, type: item.type, title: item.title, note: item.note || '' });
      lastTouchedId = id;
      listDirty = true;
      commit();
      buzz(12);

      const songNo = setlist.filter(i => i.type === 'song').length;
      showToast(item.type === 'song' ? `第 ${songNo} 首：${item.title}` : `已加入：${item.title}`, { undo: true });

      // 若搜尋框有輸入文字，加入歌單後自動清空、收起鍵盤並還原完整歌曲庫
      const searchInput = $('song-filter');
      if (searchInput.value.trim() !== '') {
        searchInput.value = '';
        searchInput.blur();
        $('filter-clear').classList.add('hidden');
        renderSongsGrid();
      }
    }

    function moveItem(id, dir) {
      const idx = setlist.findIndex(i => i.id === id);
      const to = idx + dir;
      if (idx < 0 || to < 0 || to >= setlist.length) return;

      const listEl = $('setlist-items');
      const beforeTop = listEl.querySelector(`[data-item="${id}"]`).getBoundingClientRect().top;

      [setlist[idx], setlist[to]] = [setlist[to], setlist[idx]];
      lastSnapshot = null;   // 移動不提供復原，避免舊的復原鈕蓋掉這次調整
      hideToast();
      lastTouchedId = id;
      commit();
      buzz(8);

      // 讓被移動的項目維持在螢幕同一個位置，連續點「上移 / 下移」才不會點到別首
      const after = listEl.querySelector(`[data-item="${id}"]`);
      if (after) window.scrollBy(0, after.getBoundingClientRect().top - beforeTop);
    }

    function deleteItem(id) {
      const idx = setlist.findIndex(i => i.id === id);
      if (idx < 0) return;
      takeSnapshot();
      const removed = setlist.splice(idx, 1)[0];
      lastTouchedId = null;
      commit();
      showToast(`已移除：${removed.title}`, { undo: true });
    }

    // ---------- 檢視切換 ----------
    function showView(name, opts) {
      opts = opts || {};
      if (!opts.initial) scrollPos[currentView] = window.scrollY;
      currentView = name;

      $('view-pick').classList.toggle('hidden', name !== 'pick');
      $('view-list').classList.toggle('hidden', name !== 'list');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const active = btn.dataset.view === name;
        btn.classList.toggle('bg-gradient-to-r', active);
        btn.classList.toggle('from-stayc-pink', active);
        btn.classList.toggle('to-stayc-purple', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('bg-[#181628]', !active);
        btn.classList.toggle('text-gray-400', !active);
        if (active) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
      });

      if (name === 'list' && listDirty) {
        listDirty = false;
        window.scrollTo(0, document.documentElement.scrollHeight);   // 剛加完歌，直接看到最新一首
      } else {
        window.scrollTo(0, scrollPos[name] || 0);
      }
    }

    // ---------- 專輯標籤 ----------
    const TAB_BASE = 'album-tab-btn btn-press shrink-0 h-10 px-4 rounded-full text-[13px] whitespace-nowrap border transition-colors ';
    const TAB_ON = 'bg-stayc-pink border-stayc-pink text-white font-semibold';
    const TAB_OFF = 'bg-[#181628] border-gray-700/60 text-gray-300';

    function renderAlbumTabs() {
      const tabs = $('album-tabs');
      tabs.innerHTML = '';
      const make = (id, label) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.albumId = id;
        btn.textContent = label;
        btn.className = TAB_BASE + (id === currentAlbumFilter ? TAB_ON : TAB_OFF);
        tabs.appendChild(btn);
      };
      make('all', '全部專輯');
      STAYC_ALBUMS.forEach(a => make(a.id, a.short));
    }

    // ---------- 曲庫 ----------
    function renderSongsGrid() {
      const container = $('songs-grid');
      container.innerHTML = '';

      const query = $('song-filter').value.trim().toLowerCase();
      let hasAnyMatch = false;

      // 搜尋時一律跨所有專輯比對；沒搜尋時才依專輯標籤篩選
      const albumsToRender = (query || currentAlbumFilter === 'all')
        ? STAYC_ALBUMS
        : STAYC_ALBUMS.filter(a => a.id === currentAlbumFilter);

      albumsToRender.forEach(album => {
        const matched = album.songs.filter(s => !query || s.name.toLowerCase().includes(query));
        if (matched.length === 0) return;
        hasAnyMatch = true;

        const group = document.createElement('div');
        group.className = 'bg-[#12111d]/70 rounded-2xl p-3 border border-stayc-border/60';

        const chips = matched.map(song => {
          let style = 'bg-[#181628] border-gray-700/70 text-gray-200';
          let badge = '';
          if (song.isMedley) {
            style = 'bg-gradient-to-r from-pink-950/60 to-purple-950/60 border-pink-500/60 text-pink-200 font-semibold shadow-sm shadow-pink-500/20';
            badge = '<span class="shrink-0 text-[9px] px-1 py-px rounded bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold">MEDLEY</span>';
          } else if (song.isTitle) {
            style = 'bg-pink-950/40 border-pink-500/50 text-pink-200 font-semibold';
            badge = '<span class="shrink-0 text-[9px] px-1 py-px rounded bg-pink-500 text-white font-bold">TITLE</span>';
          } else if (song.isSolo) {
            style = 'bg-rose-950/40 border-rose-500/50 text-rose-200 font-medium';
            badge = '<span class="shrink-0 text-[9px] px-1 py-px rounded bg-rose-600 text-white font-bold">SOLO</span>';
          } else if (song.isUnit) {
            style = 'bg-purple-950/40 border-purple-500/50 text-purple-200 font-medium';
            badge = '<span class="shrink-0 text-[9px] px-1 py-px rounded bg-purple-600 text-white font-bold">UNIT</span>';
          }
          return `<button type="button" data-song="${escapeHtml(song.name)}" class="song-chip btn-press max-w-full min-h-[44px] px-3 py-2 rounded-xl border text-[13px] leading-snug text-left flex items-center gap-1.5 ${style}">` +
                 `<span class="min-w-0 break-words">${escapeHtml(song.name)}</span>${badge}` +
                 `<span class="mark hidden ml-auto pl-1 shrink-0 text-xs font-bold text-stayc-neon"></span></button>`;
        }).join('');

        group.innerHTML = `
          <div class="flex items-center justify-between gap-2 text-xs mb-2.5 pb-1.5 border-b border-gray-800 text-gray-400">
            <span class="font-bold text-stayc-neon min-w-0">💿 ${escapeHtml(album.name)}</span>
            <span class="text-[11px] text-gray-500 shrink-0">${escapeHtml(album.year)}</span>
          </div>
          <div class="flex flex-wrap gap-2">${chips}</div>`;
        container.appendChild(group);
      });

      if (!hasAnyMatch) {
        container.innerHTML = '<div class="text-sm text-gray-500 py-8 text-center">找不到相符的歌曲，可以到上方「手動新增」自行輸入</div>';
      }
      updateSongMarks();
    }

    // 在曲庫按鈕上標示「已加入歌單」與次數
    function updateSongMarks() {
      const counts = {};
      setlist.forEach(i => { if (i.type === 'song') counts[i.title] = (counts[i.title] || 0) + 1; });
      document.querySelectorAll('#songs-grid [data-song]').forEach(btn => {
        const n = counts[btn.dataset.song] || 0;
        const mark = btn.querySelector('.mark');
        btn.classList.toggle('is-added', n > 0);
        mark.classList.toggle('hidden', n === 0);
        mark.textContent = n === 0 ? '' : (n === 1 ? '✓' : `✓×${n}`);
      });
    }

    // ---------- 歌單列表 ----------
    function renderSetlist() {
      const listEl = $('setlist-items');
      const emptyEl = $('empty-state');

      const songCount = setlist.filter(i => i.type === 'song').length;
      const eventCount = setlist.length - songCount;
      $('setlist-count').textContent = `${songCount} 首` + (eventCount ? `＋${eventCount} 環節` : '');

      const navCount = $('nav-count');
      navCount.textContent = songCount;
      if (songCount !== prevSongCount) {
        navCount.classList.remove('bump');
        void navCount.offsetWidth;
        navCount.classList.add('bump');
        prevSongCount = songCount;
      }

      updateSongMarks();

      listEl.innerHTML = '';
      if (setlist.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');

      let songIndex = 1;
      setlist.forEach((item, index) => {
        const isEvent = item.type === 'event';
        const first = index === 0;
        const last = index === setlist.length - 1;
        const id = escapeHtml(item.id);

        const li = document.createElement('li');
        li.dataset.item = item.id;
        li.className = 'rounded-2xl border p-3 ' + (isEvent
          ? 'bg-purple-950/20 border-purple-500/30'
          : 'bg-[#151324] border-gray-800/80');
        if (item.id === lastTouchedId) li.classList.add('flash');

        const prefix = isEvent
          ? '<span class="shrink-0 text-xs px-2 py-1 rounded-md bg-purple-900/50 border border-purple-500/30 text-purple-300 font-semibold">環節</span>'
          : `<span class="shrink-0 w-7 h-7 flex items-center justify-center rounded-full bg-stayc-pink/15 text-xs font-bold text-stayc-neon">${songIndex++}</span>`;

        const iconBtn = 'btn-press shrink-0 w-11 h-11 flex items-center justify-center rounded-xl disabled:opacity-25 disabled:pointer-events-none ';
        li.innerHTML = `
          <div class="flex items-start gap-2.5">
            ${prefix}
            <div class="flex-1 min-w-0 pt-0.5 text-[15px] font-semibold leading-snug break-words ${isEvent ? 'text-purple-200' : 'text-white'}">${escapeHtml(item.title)}</div>
          </div>
          <div class="mt-2.5 flex items-center gap-2">
            <input type="text" data-id="${id}" enterkeyhint="done" autocomplete="off"
                   class="note-input flex-1 min-w-0 h-11 px-3 rounded-xl bg-[#12111d] border border-gray-700/60 text-gray-200 placeholder-gray-500 focus:outline-none focus:border-stayc-pink"
                   placeholder="備註（換服裝、高音…）" value="${escapeHtml(item.note)}">
            <button type="button" data-id="${id}" data-act="up" aria-label="上移" ${first ? 'disabled' : ''} class="${iconBtn}bg-gray-800/60 text-gray-300">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
            </button>
            <button type="button" data-id="${id}" data-act="down" aria-label="下移" ${last ? 'disabled' : ''} class="${iconBtn}bg-gray-800/60 text-gray-300">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <button type="button" data-id="${id}" data-act="del" aria-label="刪除" class="${iconBtn}bg-red-950/40 text-red-300">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>`;
        listEl.appendChild(li);
      });
      lastTouchedId = null;
    }

    // ---------- 事件 ----------
    function setupEventListeners() {
      // 演唱會資訊
      $('concert-title').addEventListener('input', saveMeta);
      $('concert-meta').addEventListener('input', saveMeta);

      // 底部導覽 / 空狀態按鈕
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => { if (btn.dataset.view !== currentView) showView(btn.dataset.view); });
      });
      $('goto-pick').addEventListener('click', () => showView('pick'));

      // 自訂表單
      $('custom-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const nameInput = $('custom-name');
        const noteInput = $('custom-note');
        const title = nameInput.value.trim();
        if (!title) return;
        addItem({ type: 'song', title, note: noteInput.value.trim() });
        nameInput.value = '';
        noteInput.value = '';
        nameInput.focus();   // 連續輸入多首時不用重新點欄位
      });

      // 快速流程標籤
      document.querySelectorAll('.tag-btn').forEach(btn => {
        btn.addEventListener('click', () => addItem({ type: btn.dataset.type, title: btn.dataset.title, note: '' }));
      });

      // 搜尋曲庫
      const searchInput = $('song-filter');
      searchInput.addEventListener('input', () => {
        $('filter-clear').classList.toggle('hidden', searchInput.value === '');
        $('filter-clear').classList.toggle('flex', searchInput.value !== '');
        renderSongsGrid();
      });
      searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchInput.blur(); });
      $('filter-clear').addEventListener('click', () => {
        searchInput.value = '';
        $('filter-clear').classList.add('hidden');
        $('filter-clear').classList.remove('flex');
        renderSongsGrid();
        searchInput.focus();
      });

      // 專輯標籤 (再點一次已選取的專輯 → 回到全部)
      $('album-tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('.album-tab-btn');
        if (!btn) return;
        const id = btn.dataset.albumId;
        currentAlbumFilter = (currentAlbumFilter === id && id !== 'all') ? 'all' : id;

        document.querySelectorAll('.album-tab-btn').forEach(b => {
          b.className = TAB_BASE + (b.dataset.albumId === currentAlbumFilter ? TAB_ON : TAB_OFF);
        });
        if (searchInput.value) {   // 切專輯時清掉搜尋，行為才不會令人困惑
          searchInput.value = '';
          $('filter-clear').classList.add('hidden');
          $('filter-clear').classList.remove('flex');
        }
        renderSongsGrid();

        // 如果已經往下捲很深，切換後把畫面拉回清單頂端
        const wrap = $('album-tabs-wrap');
        const hdrH = $('app-header').offsetHeight;
        const top = wrap.getBoundingClientRect().top + window.scrollY - hdrH;
        if (window.scrollY > top) window.scrollTo(0, Math.max(0, top));
      });

      // 點歌曲 → 加入歌單 (事件委派)
      $('songs-grid').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-song]');
        if (!btn) return;
        addItem({ type: 'song', title: btn.dataset.song, note: '' });
      });

      // 歌單列表：排序 / 刪除 (事件委派)
      const listEl = $('setlist-items');
      listEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-act]');
        if (!btn || btn.disabled) return;
        const id = btn.dataset.id;
        if (btn.dataset.act === 'up') moveItem(id, -1);
        else if (btn.dataset.act === 'down') moveItem(id, 1);
        else if (btn.dataset.act === 'del') deleteItem(id);
      });

      // 備註：邊打邊存，不會因為沒按到空白處而遺失
      listEl.addEventListener('input', (e) => {
        if (!e.target.classList.contains('note-input')) return;
        const item = setlist.find(i => i.id === e.target.dataset.id);
        if (item) {
          item.note = e.target.value.trim();
          persist();
          lastSnapshot = null;
          hideToast();
        }
      });
      listEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.classList.contains('note-input')) e.target.blur();
      });

      // 清空
      $('clear-btn').addEventListener('click', () => {
        if (setlist.length === 0) return;
        if (confirm('確定要清空歌單嗎？')) {
          takeSnapshot();
          setlist = [];
          lastTouchedId = null;
          commit();
          showToast('歌單已清空', { undo: true });
        }
      });

      // 複製 / 復原 / 備援視窗
      $('copy-btn').addEventListener('click', copyFormattedSetlist);
      $('toast-undo').addEventListener('click', () => { undo(); });
      $('copy-close').addEventListener('click', closeCopyModal);
      $('copy-modal').addEventListener('click', (e) => { if (e.target === $('copy-modal')) closeCopyModal(); });
      $('share-btn').addEventListener('click', () => {
        navigator.share({ text: $('copy-textarea').value }).catch(() => {});
      });
    }

    // ---------- 複製 ----------
    function buildSetlistText() {
      const title = $('concert-title').value.trim() || 'STAYC CONCERT SETLIST';
      const meta = $('concert-meta').value.trim();

      let text = `💖 ${title} 💖\n`;
      if (meta) text += `📍 ${meta}\n`;
      text += `──────────────\n`;

      let songNo = 1;
      setlist.forEach(item => {
        if (item.type === 'event') {
          text += `\n[ ${item.title} ]\n`;
        } else {
          text += `${String(songNo++).padStart(2, '0')}. ${item.title}`;
          if (item.note) text += ` (${item.note})`;
          text += `\n`;
        }
      });

      text += `──────────────\n`;
      text += `#STAYC #스테이씨 #STAYC_SETLIST`;
      return text;
    }

    function legacyCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    function openCopyModal(text) {
      const ta = $('copy-textarea');
      ta.value = text;
      $('share-btn').classList.toggle('hidden', !navigator.share);
      $('copy-modal').classList.remove('hidden');
      $('copy-modal').classList.add('flex');
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
    }

    function closeCopyModal() {
      $('copy-modal').classList.add('hidden');
      $('copy-modal').classList.remove('flex');
    }

    async function copyFormattedSetlist() {
      if (setlist.length === 0) {
        showToast('目前歌單是空的，無法複製');
        return;
      }
      const text = buildSetlistText();
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          showToast('已複製社群排版歌單 📋');
          return;
        }
      } catch (err) { /* 往下走備援 */ }
      if (legacyCopy(text)) {
        showToast('已複製社群排版歌單 📋');
        return;
      }
      openCopyModal(text);
    }

    // ---------- Toast ----------
    let toastTimeout;
    function showToast(message, opts) {
      opts = opts || {};
      const toast = $('toast');
      $('toast-msg').textContent = message;
      $('toast-undo').classList.toggle('hidden', !opts.undo);
      toast.style.pointerEvents = opts.undo ? 'auto' : 'none';
      toast.classList.remove('opacity-0', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(hideToast, opts.undo ? 4500 : 1800);
    }

    function hideToast() {
      const toast = $('toast');
      clearTimeout(toastTimeout);
      toast.style.pointerEvents = 'none';
      toast.classList.remove('opacity-100', 'translate-y-0');
      toast.classList.add('opacity-0', 'translate-y-3');
    }

    // ---------- 螢幕常亮 (演唱會中不會自動變暗鎖屏) ----------
    let wakeLock = null;
    let wakeWanted = safeGet(WAKE_KEY) !== '0';

    function updateWakeUI() {
      const btn = $('wake-btn');
      const on = !!wakeLock;
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.classList.toggle('bg-amber-500/20', on);
      btn.classList.toggle('text-amber-300', on);
      btn.classList.toggle('border-amber-400/50', on);
      btn.classList.toggle('bg-gray-800/80', !on);
      btn.classList.toggle('text-gray-400', !on);
      btn.classList.toggle('border-gray-700/60', !on);
    }

    async function applyWake() {
      try {
        if (wakeWanted && document.visibilityState === 'visible') {
          if (!wakeLock) {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; updateWakeUI(); });
          }
        } else if (wakeLock) {
          await wakeLock.release();
          wakeLock = null;
        }
      } catch (e) {
        wakeLock = null;
      }
      updateWakeUI();
    }

    function setupWakeLock() {
      const btn = $('wake-btn');
      if (!('wakeLock' in navigator)) {
        btn.classList.add('hidden');
        return;
      }
      applyWake();
      document.addEventListener('visibilitychange', applyWake);
      // 部分瀏覽器要等第一次點擊才允許，補一次
      window.addEventListener('pointerdown', () => { if (wakeWanted && !wakeLock) applyWake(); }, { once: true });

      btn.addEventListener('click', async () => {
        if (wakeLock) {
          wakeWanted = false;
          safeSet(WAKE_KEY, '0');
          await applyWake();
          showToast('螢幕常亮：關');
        } else {
          wakeWanted = true;
          safeSet(WAKE_KEY, '1');
          await applyWake();
          showToast(wakeLock ? '螢幕常亮：開 ☀️' : '這個裝置目前無法開啟螢幕常亮');
        }
      });
    }
  </script>
</body>
</html>
